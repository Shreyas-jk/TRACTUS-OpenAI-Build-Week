[workspace]
members = ["chaos-core", "chaosd", "ct-shim"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
globset = "0.4"
blake3 = "1.5"
ron = "0.10"
tokio = { version = "1.48", features = ["rt", "net", "time", "process", "macros", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
insta = "1.43"
proptest = "1.6"
